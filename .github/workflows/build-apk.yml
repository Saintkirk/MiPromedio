name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode release keystore
        run: base64 -d app/mipromedio-release.jks.b64 > app/mipromedio-release.jks

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Align APK with zipalign
        run: |
          mkdir -p app/build/outputs/apk/release/optimized
          $ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign -v 4 \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/optimized/app-release.apk

      - name: Get version info
        id: version
        run: |
          VERSION=$(grep "versionName" app/build.gradle.kts | grep -oP '"\K[^"]+')
          BUILD_DATE=$(date +%Y%m%d)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiPromedio-v${{ steps.version.outputs.version }}-signed
          path: app/build/outputs/apk/release/optimized/app-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: app/build/outputs/apk/release/optimized/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Summary
        if: always()
        run: |
          echo "✅ APK Firmada y Optimizada"
          echo "📦 Versión: ${{ steps.version.outputs.version }}"
          echo "📅 Build: ${{ steps.version.outputs.build_date }}"
          echo "📍 Ubicación: app/build/outputs/apk/release/optimized/app-release.apk"
